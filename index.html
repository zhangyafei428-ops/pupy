<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>友谊相处模式确诊测试｜成年人友情诊断书</title>
  <style>
    /* =========================================================================
       零外部依赖原生样式：新粗野主义（Neo-Brutalism）复古医疗确诊单风格
       ========================================================================= */
    :root {
      --bg-page: #EFECE6;
      --bg-paper: #FAF8F5;
      --ink: #18181B;
      --ink-muted: #52525B;
      --yellow: #FACC15;
      --red: #EF4444;
      --mint: #34D399;
      --pink: #F472B6;
      --sky: #38BDF8;
      --border: 2px solid #18181B;
      --shadow: 4px 4px 0 #18181B;
      --shadow-sm: 2.5px 2.5px 0 #18181B;
      --shadow-lg: 5px 5px 0 #18181B;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background-color: var(--bg-page);
      background-image:
        linear-gradient(to right, rgba(24, 24, 27, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(24, 24, 27, 0.06) 1px, transparent 1px);
      background-size: 22px 22px;
      line-height: 1.5;
    }

    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    /* 手机端居中容器 */
    .app-shell {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 16px 14px 48px;
      position: relative;
    }

    /* 通用粗野主义卡片与按钮 */
    .neo-card {
      background: var(--bg-paper);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius-lg);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .neo-subcard {
      background: #FFFFFF;
      border: var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    .neo-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 900;
      color: var(--ink);
      background: #FFFFFF;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
      text-align: center;
      line-height: 1.35;
    }

    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .neo-btn-sm {
      width: auto;
      padding: 7px 12px;
      font-size: 12px;
      box-shadow: var(--shadow-sm);
      border-radius: 9px;
    }

    .btn-yellow { background: var(--yellow); }
    .btn-mint { background: var(--mint); }
    .btn-red { background: var(--red); color: #FFFFFF; }
    .btn-ink { background: var(--ink); color: var(--bg-paper); }
    .btn-pink { background: #FBCFE8; }

    /* 标签与徽章 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 9px;
      border-radius: 7px;
      border: 1.5px solid var(--ink);
      background: #FFFFFF;
      white-space: nowrap;
    }
    .badge-ink { background: var(--ink); color: var(--yellow); border-color: var(--ink); }
    .badge-yellow { background: var(--yellow); color: var(--ink); }
    .badge-mint { background: var(--mint); color: var(--ink); }
    .badge-red { background: var(--red); color: #FFFFFF; }

    /* 顶部栏 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    /* 输入框 */
    .neo-input {
      width: 100%;
      background: #FFFFFF;
      border: var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      outline: none;
      transition: background-color 0.15s ease;
    }
    .neo-input::placeholder {
      color: #A1A1AA;
      font-weight: 500;
    }
    .neo-input:focus {
      background: #FEFCE8;
    }

    /* 红色印章 */
    .stamp-circle {
      position: absolute;
      top: 52px;
      right: 12px;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 3px solid var(--red);
      box-shadow: inset 0 0 0 2px var(--bg-paper), inset 0 0 0 3.5px var(--red);
      color: var(--red);
      background: rgba(250, 248, 245, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      transform: rotate(-14deg);
      pointer-events: none;
      z-index: 5;
    }
    .stamp-circle .st-top { font-size: 10px; }
    .stamp-circle .st-mid {
      font-size: 14px;
      letter-spacing: 2px;
      border-top: 2px solid var(--red);
      border-bottom: 2px solid var(--red);
      margin: 2px 0;
      padding: 0 3px;
    }
    .stamp-circle .st-bot { font-size: 9px; }

    .stamp-rect {
      display: inline-block;
      border: 3px solid var(--red);
      color: var(--red);
      background: rgba(239, 68, 68, 0.06);
      border-radius: 10px;
      padding: 8px 16px;
      transform: rotate(-3.5deg);
      text-align: center;
    }

    /* 进度条 */
    .progress-track {
      width: 100%;
      height: 15px;
      background: #FFFFFF;
      border: var(--border);
      border-radius: 999px;
      padding: 2px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--mint);
      border-right: 2px solid var(--ink);
      transition: width 0.25s ease;
    }

    /* 答题选项按钮 */
    .option-btn {
      width: 100%;
      text-align: left;
      background: #FFFFFF;
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      align-items: flex-start;
      gap: 11px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.12s ease;
    }
    .option-btn:active,
    .option-btn.selected {
      background: var(--yellow);
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .option-letter {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--bg-paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
      margin-top: 1px;
    }
    .option-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.55;
    }

    /* 撕纸虚线与半圆缺口 */
    .ticket-divider {
      border-top: 2px dashed var(--ink);
      margin-top: 18px;
      padding-top: 14px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .ticket-divider::before,
    .ticket-divider::after {
      content: "";
      position: absolute;
      top: -9px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg-page);
      border: 2px solid var(--ink);
    }
    .ticket-divider::before { left: -27px; }
    .ticket-divider::after { right: -27px; }

    /* 条形码视觉 */
    .barcode {
      height: 26px;
      width: 108px;
      opacity: 0.88;
      background-image: repeating-linear-gradient(
        90deg,
        #18181B 0px, #18181B 2px,
        transparent 2px, transparent 4px,
        #18181B 4px, #18181B 7px,
        transparent 7px, transparent 9px,
        #18181B 9px, #18181B 10px,
        transparent 10px, transparent 13px,
        #18181B 13px, #18181B 16px,
        transparent 16px, transparent 18px
      );
    }

    /* 能量条与指标条 */
    .axis-row { margin-bottom: 9px; }
    .axis-row:last-child { margin-bottom: 0; }
    .axis-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .axis-track {
      width: 100%;
      height: 10px;
      background: var(--bg-paper);
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      overflow: hidden;
    }
    .axis-fill {
      height: 100%;
      border-right: 1.5px solid var(--ink);
      transition: width 0.45s ease;
    }

    /* 网格与间距辅助类 */
    .stack-sm > * + * { margin-top: 10px; }
    .stack-md > * + * { margin-top: 14px; }
    .stack-lg > * + * { margin-top: 18px; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .dual-vs {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }
    .tag-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .quote-box {
      background: #FEF9C3;
      border: var(--border);
      border-radius: var(--radius-md);
      padding: 13px;
    }
    .rx-box {
      background: var(--ink);
      color: var(--bg-paper);
      border-radius: var(--radius-md);
      padding: 13px;
    }

    /* 模态弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 24, 27, 0.62);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-panel {
      width: 100%;
      max-width: 390px;
      background: var(--bg-paper);
      border: 2.5px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      border-radius: var(--radius-lg);
      padding: 18px;
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeSlide 0.22s ease forwards;
    }

    /* Toast 轻提示 */
    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translate(-50%, -14px);
      z-index: 80;
      width: 90%;
      max-width: 360px;
      background: var(--ink);
      color: var(--bg-paper);
      border: 2px solid var(--ink);
      box-shadow: var(--shadow-sm);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 动画 */
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeSlide 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes stampDrop {
      0% { opacity: 0; transform: scale(1.7) rotate(-26deg); }
      75% { opacity: 1; transform: scale(0.92) rotate(-12deg); }
      100% { opacity: 0.94; transform: scale(1) rotate(-14deg); }
    }
    .animate-stamp {
      animation: stampDrop 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-error {
      animation: shakeError 0.32s ease;
      border-color: var(--red) !important;
      background: #FEF2F2 !important;
    }

    .error-msg {
      color: var(--red);
      font-size: 12px;
      font-weight: 900;
      margin-top: 6px;
      display: none;
    }
    .error-msg.show {
      display: block;
    }

    .text-link {
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 900;
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <main id="app-root"></main>
  </div>

  <!-- 全局 Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 通用弹窗（兑换码解锁 / 邀请合盘） -->
  <div id="modal-backdrop" class="modal-backdrop" onclick="handleBackdropClick(event)">
    <div id="modal-panel" class="modal-panel"></div>
  </div>

    // 5. 应用状态与存储读取

    const state = {
      view: 'home', // home | quiz | result | dualIntro | dualQuiz | dualResult | gallery
      unlocked: false,
      isBoss: false,
      userName: '',
      answers: [],

      resultCode: 'AY1',
      axisCounts: { A: 3, B: 2, X: 1, Y: 4, '1': 4, '2': 1 },
      diagNo: '',
      dualHost: { name: '神秘搭子', code: 'AY1' },
      dualGuest: { name: '', code: 'BX1', trustTag: '过命交情', survivalPick: '99' },
      dualAnswers: [],
      currentDualQ: 0,
      isTransitioning: false,
      pendingAfterUnlock: 'quiz' // quiz | guestQuiz
    };

    function loadUnlockState() {
      try {
        state.unlocked = localStorage.getItem(STORAGE_UNLOCK_KEY) === '1';
        state.isBoss = localStorage.getItem(STORAGE_BOSS_KEY) === '1';
      } catch (e) {
        state.unlocked = false;
        state.isBoss = false;
      }
    }

    function saveUnlockState(code, isBoss) {
      state.unlocked = true;
      if (isBoss) state.isBoss = true;
      try {
        localStorage.setItem(STORAGE_UNLOCK_KEY, '1');
        localStorage.setItem(STORAGE_CODE_KEY, code);
        if (isBoss) localStorage.setItem(STORAGE_BOSS_KEY, '1');
      } catch (e) {
        // 隐私模式无法写入时保持当前会话有效
      }
    }

    // =========================================================================
    // 6. 工具函数
    // =========================================================================
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function generateDiagNo(code) {
      const rand = Math.floor(1000 + Math.random() * 9000);
      return `FRD-2026-${code}-${rand}`;
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
    }

    function copyText(text, successMsg) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg || '已复制到剪贴板');
          return;
        }
      } catch (e) {}
      showToast('复制失败，请手动长按框内文字复制');
    }

    function openModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = html;
      backdrop.classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.remove('open');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'modal-backdrop') closeModal();
    }

    // 生成带 ?mode=duo&hostName=...&hostType=... 的免费合盘链接
    function buildDuoUrl(hostName, hostType) {
      const base = window.location.href.split('?')[0];
      const params = new URLSearchParams({
        mode: 'duo',
        hostName: hostName,
        hostType: hostType
      });
      return `${base}?${params.toString()}`;
    }

    // 计算单人结果
    function computeSingleResult() {
      const counts = { A: 0, B: 0, X: 0, Y: 0, '1': 0, '2': 0 };
      state.answers.forEach(p => { if (counts[p] !== undefined) counts[p]++; });
      state.axisCounts = counts;
      const d = counts.A >= 3 ? 'A' : 'B';
      const c = counts.X >= 3 ? 'X' : 'Y';
      const r = counts['1'] >= 3 ? '1' : '2';
      state.resultCode = `${d}${c}${r}`;
      state.diagNo = generateDiagNo(state.resultCode);
    }

    // 计算双人合盘结果（6 组专属 + 4 套三轴重合度通用模板）
    function computeDualReport(codeA, codeB, trustTag, survivalPick) {
      const pairKey = [codeA, codeB].sort().join('-');
      let base;

      if (SIGNATURE_PAIRS[pairKey]) {
        base = { ...SIGNATURE_PAIRS[pairKey] };
      } else {
        const dSame = codeA[0] === codeB[0];
        const cSame = codeA[1] === codeB[1];
        const rSame = codeA[2] === codeB[2];
        const sameCount = (dSame ? 1 : 0) + (cSame ? 1 : 0) + (rSame ? 1 : 0);

        if (sameCount === 3) {
          base = {
            stamp: '照镜子发疯局',
            survivalBase: 86,
            coldWarBase: 42,
            crazyBase: 95,
            diagnosis: '你俩简直是一个模子刻出来的！开心时能凑一块儿把天聊塌，一旦触发共同雷区，要不一起原地爆炸，要不一起进入静音微死状态。',
            victim: '你们身边的其他朋友最委屈，完全插不进你俩的脑电波。',
            bottomLine: '互相多给对方留一点容错率，别跟另一个自己较真。'
          };
        } else if (sameCount === 0) {
          base = {
            stamp: '跨物种社交奇迹',
            survivalBase: 46,
            coldWarBase: 82,
            crazyBase: 68,
            diagnosis: '相处距离、冲突应对、情绪雷达三个维度全反！真不知道你俩当初到底是怎么玩到一块儿去的，堪称人类友谊史上的未解之谜。',
            victim: '两个人都觉得对方是外星人，偶尔互相气到心梗。',
            bottomLine: '求同存异，记住对方不是故意气你，只是出厂设置完全相反。'
          };
        } else if (dSame && !cSame) {
          base = {
            stamp: '一个开麦一个静音局',
            survivalBase: 66,
            coldWarBase: 74,
            crazyBase: 76,
            diagnosis: '平时相处距离挺合拍，唯一的大 Bug 出在吵架时：一个恨不得当场拉横幅把话讲透，另一个已经礼貌微笑准备悄悄退场。',
            victim: '静音的那个憋着一肚子话，开麦的那个一拳打在棉花上。',
            bottomLine: '有矛盾时，开麦方降一半音量，静音方至少说出一句真话。'
          };
        } else {
          base = {
            stamp: '节奏错位拉扯局',
            survivalBase: 62,
            coldWarBase: 66,
            crazyBase: 72,
            diagnosis: '三观底色其实挺合拍，但一个想天天贴贴分享日常，一个想平时散养有事再摇。感情没问题，纯属社交充电频率不同步。',
            victim: '黏人的那个总觉得自己被冷落，散养的那个总觉得压力山大。',
            bottomLine: '提前对齐联络频率，别用回消息的速度来丈量感情深浅。'
          };
        }
      }

      const clamp = (n) => Math.max(5, Math.min(99, Math.round(n)));
      const survivalShift = survivalPick === '99' ? 8 : -16;
      const trustColdShift = trustTag === '过命交情' ? -9 : 12;
      const trustCrazyShift = trustTag === '过命交情' ? 7 : -6;

      return {
        ...base,
        survival: clamp(base.survivalBase + survivalShift),
        coldWar: clamp(base.coldWarBase + trustColdShift),
        crazy: clamp(base.crazyBase + trustCrazyShift)
      };
    }

          state.dualHost = {
            name: hostName ? hostName.slice(0, 12) : '神秘搭子',
            code: hostType
          };
          state.view = 'dualIntro';
        }
      } catch (e) {
        // 忽略 URL 参数异常
      }
      render();
    });
  </script>
</body>
</html>
