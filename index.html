<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>友谊相处模式确诊测试｜成年人友情诊断书</title>
  <style>
    /* =========================================================================
       零外部依赖原生样式：新粗野主义（Neo-Brutalism）复古医疗确诊单风格
       ========================================================================= */
    :root {
      --bg-page: #EFECE6;
      --bg-paper: #FAF8F5;
      --ink: #18181B;
      --ink-muted: #52525B;
      --yellow: #FACC15;
      --red: #EF4444;
      --mint: #34D399;
      --pink: #F472B6;
      --sky: #38BDF8;
      --border: 2px solid #18181B;
      --shadow: 4px 4px 0 #18181B;
      --shadow-sm: 2.5px 2.5px 0 #18181B;
      --shadow-lg: 5px 5px 0 #18181B;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background-color: var(--bg-page);
      background-image:
        linear-gradient(to right, rgba(24, 24, 27, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(24, 24, 27, 0.06) 1px, transparent 1px);
      background-size: 22px 22px;
      line-height: 1.5;
    }

    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    /* 手机端居中容器 */
    .app-shell {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 16px 14px 48px;
      position: relative;
    }

    /* 通用粗野主义卡片与按钮 */
    .neo-card {
      background: var(--bg-paper);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius-lg);
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .neo-subcard {
      background: #FFFFFF;
      border: var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    .neo-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 900;
      color: var(--ink);
      background: #FFFFFF;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.15s ease;
      text-align: center;
      line-height: 1.35;
    }

    .neo-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .neo-btn-sm {
      width: auto;
      padding: 7px 12px;
      font-size: 12px;
      box-shadow: var(--shadow-sm);
      border-radius: 9px;
    }

    .btn-yellow { background: var(--yellow); }
    .btn-mint { background: var(--mint); }
    .btn-red { background: var(--red); color: #FFFFFF; }
    .btn-ink { background: var(--ink); color: var(--bg-paper); }
    .btn-pink { background: #FBCFE8; }

    /* 标签与徽章 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 9px;
      border-radius: 7px;
      border: 1.5px solid var(--ink);
      background: #FFFFFF;
      white-space: nowrap;
    }
    .badge-ink { background: var(--ink); color: var(--yellow); border-color: var(--ink); }
    .badge-yellow { background: var(--yellow); color: var(--ink); }
    .badge-mint { background: var(--mint); color: var(--ink); }
    .badge-red { background: var(--red); color: #FFFFFF; }

    /* 顶部栏 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    /* 输入框 */
    .neo-input {
      width: 100%;
      background: #FFFFFF;
      border: var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      outline: none;
      transition: background-color 0.15s ease;
    }
    .neo-input::placeholder {
      color: #A1A1AA;
      font-weight: 500;
    }
    .neo-input:focus {
      background: #FEFCE8;
    }

    /* 红色印章 */
    .stamp-circle {
      position: absolute;
      top: 52px;
      right: 12px;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 3px solid var(--red);
      box-shadow: inset 0 0 0 2px var(--bg-paper), inset 0 0 0 3.5px var(--red);
      color: var(--red);
      background: rgba(250, 248, 245, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      transform: rotate(-14deg);
      pointer-events: none;
      z-index: 5;
    }
    .stamp-circle .st-top { font-size: 10px; }
    .stamp-circle .st-mid {
      font-size: 14px;
      letter-spacing: 2px;
      border-top: 2px solid var(--red);
      border-bottom: 2px solid var(--red);
      margin: 2px 0;
      padding: 0 3px;
    }
    .stamp-circle .st-bot { font-size: 9px; }

    .stamp-rect {
      display: inline-block;
      border: 3px solid var(--red);
      color: var(--red);
      background: rgba(239, 68, 68, 0.06);
      border-radius: 10px;
      padding: 8px 16px;
      transform: rotate(-3.5deg);
      text-align: center;
    }

    /* 进度条 */
    .progress-track {
      width: 100%;
      height: 15px;
      background: #FFFFFF;
      border: var(--border);
      border-radius: 999px;
      padding: 2px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--mint);
      border-right: 2px solid var(--ink);
      transition: width 0.25s ease;
    }

    /* 答题选项按钮 */
    .option-btn {
      width: 100%;
      text-align: left;
      background: #FFFFFF;
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      align-items: flex-start;
      gap: 11px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.12s ease;
    }
    .option-btn:active,
    .option-btn.selected {
      background: var(--yellow);
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .option-letter {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--bg-paper);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
      margin-top: 1px;
    }
    .option-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.55;
    }

    /* 撕纸虚线与半圆缺口 */
    .ticket-divider {
      border-top: 2px dashed var(--ink);
      margin-top: 18px;
      padding-top: 14px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .ticket-divider::before,
    .ticket-divider::after {
      content: "";
      position: absolute;
      top: -9px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg-page);
      border: 2px solid var(--ink);
    }
    .ticket-divider::before { left: -27px; }
    .ticket-divider::after { right: -27px; }

    /* 条形码视觉 */
    .barcode {
      height: 26px;
      width: 108px;
      opacity: 0.88;
      background-image: repeating-linear-gradient(
        90deg,
        #18181B 0px, #18181B 2px,
        transparent 2px, transparent 4px,
        #18181B 4px, #18181B 7px,
        transparent 7px, transparent 9px,
        #18181B 9px, #18181B 10px,
        transparent 10px, transparent 13px,
        #18181B 13px, #18181B 16px,
        transparent 16px, transparent 18px
      );
    }

    /* 能量条与指标条 */
    .axis-row { margin-bottom: 9px; }
    .axis-row:last-child { margin-bottom: 0; }
    .axis-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .axis-track {
      width: 100%;
      height: 10px;
      background: var(--bg-paper);
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      overflow: hidden;
    }
    .axis-fill {
      height: 100%;
      border-right: 1.5px solid var(--ink);
      transition: width 0.45s ease;
    }

    /* 网格与间距辅助类 */
    .stack-sm > * + * { margin-top: 10px; }
    .stack-md > * + * { margin-top: 14px; }
    .stack-lg > * + * { margin-top: 18px; }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .dual-vs {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }
    .tag-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .quote-box {
      background: #FEF9C3;
      border: var(--border);
      border-radius: var(--radius-md);
      padding: 13px;
    }
    .rx-box {
      background: var(--ink);
      color: var(--bg-paper);
      border-radius: var(--radius-md);
      padding: 13px;
    }

    /* 模态弹窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 24, 27, 0.62);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-panel {
      width: 100%;
      max-width: 390px;
      background: var(--bg-paper);
      border: 2.5px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      border-radius: var(--radius-lg);
      padding: 18px;
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeSlide 0.22s ease forwards;
    }

    /* Toast 轻提示 */
    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translate(-50%, -14px);
      z-index: 80;
      width: 90%;
      max-width: 360px;
      background: var(--ink);
      color: var(--bg-paper);
      border: 2px solid var(--ink);
      box-shadow: var(--shadow-sm);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 动画 */
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeSlide 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes stampDrop {
      0% { opacity: 0; transform: scale(1.7) rotate(-26deg); }
      75% { opacity: 1; transform: scale(0.92) rotate(-12deg); }
      100% { opacity: 0.94; transform: scale(1) rotate(-14deg); }
    }
    .animate-stamp {
      animation: stampDrop 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
    }
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-error {
      animation: shakeError 0.32s ease;
      border-color: var(--red) !important;
      background: #FEF2F2 !important;
    }

    .error-msg {
      color: var(--red);
      font-size: 12px;
      font-weight: 900;
      margin-top: 6px;
      display: none;
    }
    .error-msg.show {
      display: block;
    }

    .text-link {
      background: none;
      border: none;
      font-size: 12px;
      font-weight: 900;
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
  </style>
</head>

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function generateDiagNo(code) {
      const rand = Math.floor(1000 + Math.random() * 9000);
      return `FRD-2026-${code}-${rand}`;
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
    }

    function copyText(text, successMsg) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg || '已复制到剪贴板');
          return;
        }
      } catch (e) {}
      showToast('复制失败，请手动长按框内文字复制');
    }

    function openModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const panel = document.getElementById('modal-panel');
      panel.innerHTML = html;
      backdrop.classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.remove('open');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'modal-backdrop') closeModal();
    }

      const d = counts.A >= 3 ? 'A' : 'B';
      const c = counts.X >= 3 ? 'X' : 'Y';
      const r = counts['1'] >= 3 ? '1' : '2';
      state.resultCode = `${d}${c}${r}`;
      state.diagNo = generateDiagNo(state.resultCode);
    }

    // 计算双人合盘结果（6 组专属 + 4 套三轴重合度通用模板）
    function computeDualReport(codeA, codeB, trustTag, survivalPick) {
      const pairKey = [codeA, codeB].sort().join('-');
      let base;

      if (SIGNATURE_PAIRS[pairKey]) {
        base = { ...SIGNATURE_PAIRS[pairKey] };
      } else {
        const dSame = codeA[0] === codeB[0];
        const cSame = codeA[1] === codeB[1];
        const rSame = codeA[2] === codeB[2];
        const sameCount = (dSame ? 1 : 0) + (cSame ? 1 : 0) + (rSame ? 1 : 0);

        if (sameCount === 3) {
          base = {
            stamp: '照镜子发疯局',
            survivalBase: 86,
            coldWarBase: 42,
            crazyBase: 95,
            diagnosis: '你俩简直是一个模子刻出来的！开心时能凑一块儿把天聊塌，一旦触发共同雷区，要不一起原地爆炸，要不一起进入静音微死状态。',
            victim: '你们身边的其他朋友最委屈，完全插不进你俩的脑电波。',
            bottomLine: '互相多给对方留一点容错率，别跟另一个自己较真。'
          };
        } else if (sameCount === 0) {
          base = {
            stamp: '跨物种社交奇迹',
            survivalBase: 46,
            coldWarBase: 82,
            crazyBase: 68,
            diagnosis: '相处距离、冲突应对、情绪雷达三个维度全反！真不知道你俩当初到底是怎么玩到一块儿去的，堪称人类友谊史上的未解之谜。',
            victim: '两个人都觉得对方是外星人，偶尔互相气到心梗。',
            bottomLine: '求同存异，记住对方不是故意气你，只是出厂设置完全相反。'
          };
        } else if (dSame && !cSame) {
          base = {
            stamp: '一个开麦一个静音局',
            survivalBase: 66,
            coldWarBase: 74,
            crazyBase: 76,
            diagnosis: '平时相处距离挺合拍，唯一的大 Bug 出在吵架时：一个恨不得当场拉横幅把话讲透，另一个已经礼貌微笑准备悄悄退场。',
            victim: '静音的那个憋着一肚子话，开麦的那个一拳打在棉花上。',
            bottomLine: '有矛盾时，开麦方降一半音量，静音方至少说出一句真话。'
          };
        } else {
          base = {
            stamp: '节奏错位拉扯局',
            survivalBase: 62,
            coldWarBase: 66,
            crazyBase: 72,
            diagnosis: '三观底色其实挺合拍，但一个想天天贴贴分享日常，一个想平时散养有事再摇。感情没问题，纯属社交充电频率不同步。',
            victim: '黏人的那个总觉得自己被冷落，散养的那个总觉得压力山大。',
            bottomLine: '提前对齐联络频率，别用回消息的速度来丈量感情深浅。'
          };
        }
      }

      const clamp = (n) => Math.max(5, Math.min(99, Math.round(n)));
      const survivalShift = survivalPick === '99' ? 8 : -16;
      const trustColdShift = trustTag === '过命交情' ? -9 : 12;
      const trustCrazyShift = trustTag === '过命交情' ? 7 : -6;

      return {
        ...base,
        survival: clamp(base.survivalBase + survivalShift),
        coldWar: clamp(base.coldWarBase + trustColdShift),
        crazy: clamp(base.crazyBase + trustCrazyShift)
      };
    }

                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // --- 《双人友谊确诊单》结果页 ---
    function renderDualResult() {
      const hostP = PERSONALITIES[state.dualHost.code] || PERSONALITIES.AY1;
      const guestP = PERSONALITIES[state.dualGuest.code] || PERSONALITIES.BX1;
      const hostName = state.dualHost.name.trim() || '神秘搭子';
      const guestName = state.dualGuest.name.trim() || '嘴替搭子';
      const report = computeDualReport(
        hostP.code,
        guestP.code,
        state.dualGuest.trustTag,
        state.dualGuest.survivalPick
      );
      const cpNo = `CP-${hostP.code}X${guestP.code}-${Math.floor(100 + Math.random() * 899)}`;

      return `
        <div class="animate-in stack-md">
          <div class="top-bar">
            <span class="badge badge-ink">📸 截图甩给你的搭子对峙</span>
            <button class="text-link" onclick="goHome()">返回首页</button>
          </div>

          <div class="neo-card">
            <div style="text-align:center; border-bottom:2px solid var(--ink); padding-bottom:10px;">
              <div class="font-mono" style="font-size:10px; font-weight:900; letter-spacing:1px; color:var(--ink-muted);">DUAL FRIENDSHIP REPORT</div>
              <h1 style="font-size:19px; font-weight:900; margin-top:2px;">《双人友谊确诊单》</h1>
            </div>

            <!-- 双人并列 -->
            <div class="dual-vs" style="margin-top:14px;">
              <div style="border:2px solid var(--ink); border-radius:12px; padding:10px 8px; text-align:center; background:${hostP.bg};">
                <div class="badge" style="font-size:10px; max-width:100%; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(hostName)}</div>
                <div style="font-size:26px; margin:4px 0;">${hostP.emoji}</div>
                <div style="font-size:12px; font-weight:900; line-height:1.3;">${hostP.name}</div>
              </div>
              <div class="font-mono" style="font-size:20px; font-weight:900;">×</div>
              <div style="border:2px solid var(--ink); border-radius:12px; padding:10px 8px; text-align:center; background:${guestP.bg};">
                <div class="badge" style="font-size:10px; max-width:100%; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(guestName)}</div>
                <div style="font-size:26px; margin:4px 0;">${guestP.emoji}</div>
                <div style="font-size:12px; font-weight:900; line-height:1.3;">${guestP.name}</div>
              </div>
            </div>

            <!-- 核心关系印章 -->
            <div style="text-align:center; margin-top:16px;">
              <div class="stamp-rect">
                <div class="font-mono" style="font-size:9.5px; font-weight:900; letter-spacing:1px;">RELATIONSHIP VERDICT</div>
                <div style="font-size:17px; font-weight:900; margin-top:2px;">【${report.stamp}】</div>
              </div>
            </div>

            <!-- 彩蛋标签 -->
            <div class="tag-wrap" style="justify-content:center; margin-top:14px;">
              <span class="badge badge-yellow">深夜两点：${state.dualGuest.trustTag}</span>
              <span class="badge">5天自由行：${state.dualGuest.survivalPick === '99' ? '神仙搭子不翻车' : '第4天想提前回国'}</span>
            </div>

            <!-- 三项扎心数值 -->
            <div class="neo-subcard" style="margin-top:14px;">
              ${renderMetricRow('✈️ 旅游存活率', report.survival, report.survival >= 70 ? '#34D399' : '#F472B6')}
              ${renderMetricRow('🧊 吵架冷战值', report.coldWar, report.coldWar >= 70 ? '#EF4444' : '#FACC15')}
              ${renderMetricRow('🤪 共同发疯指数', report.crazy, '#38BDF8')}
            </div>

            <!-- 毒舌合盘诊断 -->
            <div class="quote-box" style="margin-top:12px;">
              <div style="font-size:11.5px; font-weight:900; color:var(--red); margin-bottom:4px;">🔥 毒舌合盘诊断</div>
              <p style="font-size:12.5px; font-weight:700; line-height:1.6;">${report.diagnosis}</p>
            </div>

            <!-- 谁在偷偷受委屈 & 防崩底线 -->
            <div class="stack-sm" style="margin-top:10px;">
              <div class="neo-subcard">
                <div style="font-size:11px; font-weight:900; color:var(--ink-muted); margin-bottom:3px;">🥺 谁在偷偷受委屈？</div>
                <p style="font-size:12.5px; font-weight:800; line-height:1.55;">${report.victim}</p>
              </div>
              <div class="rx-box">
                <div style="font-size:11px; font-weight:900; color:var(--mint); margin-bottom:3px;">🛡️ 双人防崩底线</div>
                <p style="font-size:12px; font-weight:500; line-height:1.55; opacity:0.95;">${report.bottomLine}</p>
              </div>
            </div>

            <div class="ticket-divider">
              <span class="font-mono" style="font-size:10.5px; font-weight:900; color:var(--ink-muted);">${cpNo}</span>
              <div class="barcode"></div>
            </div>
          </div>

          <!-- 好友转化钩子：解锁完整单人防崩报告 -->
          <div class="neo-card" style="background:#FEF9C3;">
            <div style="display:flex; align-items:flex-start; gap:10px; margin-bottom:12px;">
              <span style="font-size:24px; line-height:1;">🔓</span>
              <div>
                <div style="font-size:14px; font-weight:900;">你被初筛为【${guestP.name}】</div>
                <p style="font-size:12px; font-weight:600; color:#3F3F46; margin-top:3px; line-height:1.5;">
                  合盘仅剧透简要称号，解锁你的完整 15 题深度测评、发疯日常、内耗冤家及专属防崩处方！
                </p>
              </div>
            </div>
            <button class="neo-btn btn-red" onclick="handleGuestUnlockClick()">
              解锁我的完整单人防崩报告 →
            </button>
          </div>

          <button class="neo-btn" style="font-size:13px; padding:12px;" onclick="copyDualShareText()">
            📋 复制双人吐槽战报发朋友圈 / 微信群
          </button>
        </div>
      `;
    }

    function renderMetricRow(label, val, color) {
      return `
        <div class="axis-row">
          <div class="axis-labels">
            <span>${label}</span>
            <span class="font-mono">${val}%</span>
          </div>
          <div class="axis-track" style="height:11px;">
            <div class="axis-fill" style="width:${val}%; background:${color};"></div>
          </div>
        </div>
      `;
    }

    // --- 店长专属 8 种人格图鉴 ---
    function renderGallery() {
      const list = Object.values(PERSONALITIES);
      return `
        <div class="animate-in stack-md">
          <div class="top-bar">
            <button class="neo-btn neo-btn-sm" onclick="goHome()">← 返回首页</button>
            <span class="badge badge-ink">👑 店长图鉴（8 种人格）</span>
          </div>

          <div class="stack-sm">
            ${list.map(p => `
              <button
                class="option-btn"
                style="align-items:center;"
                onclick="previewBossCard('${p.code}')"
              >
                <div style="width:46px; height:46px; border:2px solid var(--ink); border-radius:10px; background:${p.bg}; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;">
                  ${p.emoji}
                </div>
                <div style="flex:1; min-width:0;">
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                    <span style="font-size:15px; font-weight:900;">${p.name}</span>
                    <span class="badge badge-ink font-mono" style="font-size:10px;">${p.code} · ${p.ratio}</span>
                  </div>
                  <div style="font-size:11.5px; color:var(--ink-muted); margin-top:4px;">点击进入高清确诊单截图 →</div>
                </div>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8. 兑换码弹窗与校验逻辑
    // =========================================================================
    function openRedeemModal(afterAction) {
      state.pendingAfterUnlock = afterAction || 'quiz';
      openModal(`
        <div class="stack-md">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="badge badge-yellow">🔑 输入兑换码解锁测试</span>
            <button class="neo-btn neo-btn-sm" style="padding:4px 9px;" onclick="closeModal()">✕</button>
          </div>

          <p style="font-size:13px; font-weight:700; color:#3F3F46; line-height:1.6;">
            请输入小红书订单自动发货的 <strong>8 位兑换码</strong>解锁完整单人确诊报告（解锁后本设备可重复测试，并可无限次邀请搭子免费双人合盘）。
          </p>

          <div>
            <input
              id="redeem-input"
              class="neo-input font-mono"
              style="text-transform:uppercase; letter-spacing:2px; font-size:16px; text-align:center;"
              type="text"
              maxlength="16"
              placeholder="请输入 8 位兑换码"
              onkeydown="if(event.key==='Enter') submitRedeemCode()"
            />
            <div id="redeem-error" class="error-msg">兑换码无效，请检查是否输入正确</div>
          </div>

          <button class="neo-btn btn-yellow" onclick="submitRedeemCode()">
            立即验证并解锁 →
          </button>

          <div style="background:#FFFFFF; border:1.5px dashed rgba(24,24,27,0.35); border-radius:10px; padding:10px; font-size:11.5px; font-weight:600; color:var(--ink-muted); line-height:1.55;">
            💡 还没有兑换码？请前往小红书原笔记左下角小店拍下 <strong>0.99 元</strong>测试商品，系统将自动发送专属兑换码。
          </div>
        </div>
      `);
      setTimeout(() => {
        const input = document.getElementById('redeem-input');
        if (input) input.focus();
      }, 60);
    }

    function submitRedeemCode() {
      const input = document.getElementById('redeem-input');
      const errEl = document.getElementById('redeem-error');
      if (!input) return;

      const raw = input.value.trim().toUpperCase();
      const hash = sha256Hex(CODE_SALT + raw);
      const isBoss = hash === BOSS_HASH;
      const isValid = isBoss || VALID_CODE_HASHES.has(hash);

      if (!isValid) {
        input.classList.remove('shake-error');
        void input.offsetWidth; // 强制重绘以重复触发抖动动画
        input.classList.add('shake-error');
        if (errEl) errEl.classList.add('show');
        return;
      }

      saveUnlockState(raw, isBoss);
      closeModal();

      if (isBoss) {
        showToast('👑 店长专用码已解锁！已开启首页 8 人格图鉴');
      } else {
        showToast('🎉 解锁成功！开始你的 15 题友谊确诊');
      }

      if (state.pendingAfterUnlock === 'guestQuiz') {
        if (state.dualGuest.name.trim()) {
          state.userName = state.dualGuest.name.trim();
        }
      }
      startSingleQuiz();
    }

    // =========================================================================
    // 9. 页面交互事件处理
    // =========================================================================
    function goHome() {
      state.view = 'home';
      render();
    }

    function handleStartSingleClick() {
      if (state.unlocked) {
        startSingleQuiz();
      } else {
        openRedeemModal('quiz');
      }
    }

    function handleGuestUnlockClick() {
      if (state.unlocked) {
        if (state.dualGuest.name.trim()) state.userName = state.dualGuest.name.trim();
        startSingleQuiz();
      } else {
        openRedeemModal('guestQuiz');
      }
    }

    function startSingleQuiz() {
      state.answers = [];
      state.currentQ = 0;
      state.view = 'quiz';
      render();
    }

    function prevSingleQ() {
      if (state.currentQ === 0) {
        goHome();
      } else {
        state.currentQ--;
        render();
      }
    }

    function selectSingleOption(pole, idx) {
      if (state.isTransitioning) return;
      state.isTransitioning = true;
      state.answers[state.currentQ] = pole;

      const btn = document.getElementById(`sq-opt-${idx}`);
      if (btn) btn.classList.add('selected');

      setTimeout(() => {
        state.isTransitioning = false;
        if (state.currentQ < SINGLE_QUESTIONS.length - 1) {
          state.currentQ++;
          render();
        } else {
          computeSingleResult();
          state.view = 'result';
          render();
        }
      }, 200);
    }

    function copyDuoInviteLink() {
      const hostName = state.userName.trim() || '神秘搭子';
      const p = PERSONALITIES[state.resultCode];
      const url = buildDuoUrl(hostName, p.code);
      const msg = `救命！我刚测出我在友情里居然是【${p.name}】😂\n快来免费跟我做 5 题双人合盘，测测咱俩旅游存活率有多高👉 ${url}`;
      copyText(msg, '专属合盘链接与邀请文案已复制，快发给微信搭子！');
    }

    function simulateDuoFromResult() {
      state.dualHost = {
        name: state.userName.trim() || '神秘搭子',
        code: state.resultCode
      };
      state.dualGuest = { name: '', code: 'BX1', trustTag: '过命交情', survivalPick: '99' };
      state.dualAnswers = [];
      state.currentDualQ = 0;
      state.view = 'dualIntro';
      render();
    }

    function startDualQuiz() {
      state.dualAnswers = [];
      state.currentDualQ = 0;
      state.view = 'dualQuiz';
      render();
    }

    function prevDualQ() {
      if (state.currentDualQ === 0) {
        state.view = 'dualIntro';
        render();
      } else {
        state.currentDualQ--;
        render();
      }
    }

    function selectDualOption(val, idx) {
      if (state.isTransitioning) return;
      state.isTransitioning = true;
      state.dualAnswers[state.currentDualQ] = val;

      const btn = document.getElementById(`dq-opt-${idx}`);
      if (btn) btn.classList.add('selected');

      setTimeout(() => {
        state.isTransitioning = false;
        if (state.currentDualQ < DUAL_QUESTIONS.length - 1) {
          state.currentDualQ++;
          render();
        } else {
          state.dualGuest.code = `${state.dualAnswers[0]}${state.dualAnswers[1]}${state.dualAnswers[2]}`;
          state.dualGuest.trustTag = state.dualAnswers[3];
          state.dualGuest.survivalPick = state.dualAnswers[4];
          state.view = 'dualResult';
          render();
        }
      }, 200);
    }

    function openGallery() {
      if (!state.isBoss) return;
      state.view = 'gallery';
      render();
    }

    function previewBossCard(code) {
      state.resultCode = code;
      state.diagNo = generateDiagNo(code);
      state.axisCounts = {
        A: code[0] === 'A' ? 4 : 1,
        B: code[0] === 'B' ? 4 : 1,
        X: code[1] === 'X' ? 4 : 1,
        Y: code[1] === 'Y' ? 4 : 1,
        '1': code[2] === '1' ? 4 : 1,
        '2': code[2] === '2' ? 4 : 1
      };
      state.view = 'result';
      render();
    }

    function copyXhsShareText() {
      const p = PERSONALITIES[state.resultCode];
      const text = `刚刚测了《友谊相处模式确诊测试》，我居然被确诊为【${p.name}】（全网占比 ${p.ratio}）${p.emoji}\n扎心诊断：${p.diagnosis}\n天选搭子：${p.bestMatch.name} ｜ 内耗冤家：${p.worstMatch.name}\n#友谊确诊测试 #成年人的友谊 #搭子测试`;
      copyText(text, '小红书晒图战报已复制！');
    }

    function copyDualShareText() {
      const hostP = PERSONALITIES[state.dualHost.code];
      const guestP = PERSONALITIES[state.dualGuest.code];
      const hostName = state.dualHost.name.trim() || '神秘搭子';
      const guestName = state.dualGuest.name.trim() || '嘴替搭子';
      const report = computeDualReport(hostP.code, guestP.code, state.dualGuest.trustTag, state.dualGuest.survivalPick);
      const text = `我和 ${hostName} 的《双人友谊确诊单》出炉了😂\n【${hostP.name}】×【${guestP.name}】\n关系确诊：【${report.stamp}】\n✈️ 旅游存活率：${report.survival}% ｜ 🧊 吵架冷战值：${report.coldWar}%\n🔥 毒舌诊断：${report.diagnosis}`;
      copyText(text, '双人吐槽战报已复制！');
    }

    // =========================================================================
    // 10. 启动初始化：读取本地解锁状态 & 检查免费好友合盘 URL 参数
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadUnlockState();
      try {
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode');
        const hostName = params.get('hostName');
        const hostType = params.get('hostType');
        if (mode === 'duo' && hostType && PERSONALITIES[hostType]) {
          state.dualHost = {
            name: hostName ? hostName.slice(0, 12) : '神秘搭子',
            code: hostType
          };
          state.view = 'dualIntro';
        }
      } catch (e) {
        // 忽略 URL 参数异常
      }
      render();
    });
  </script>
</body>
</html>
